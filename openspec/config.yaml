schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Tech stack: TypeScript (ES2022, NodeNext), vitest, no runtime dependencies.
  Domain: order pricing; all money is integer kopecks (1 грн = 100 копійок).
  Authoritative behaviour spec: docs/spec/pricing-discounts.md (Task A).
  Do not change signatures in app/src/pricing.ts or shapes in app/src/types.ts.
  Do not edit materials/feature-request.md.
  New engine: app/src/discounts.ts; tests in app/src/discounts.test.ts named AC-N:.
  Named exports only; .js extensions on relative imports (NodeNext).

